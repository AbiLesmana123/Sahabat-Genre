<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style data-sg="">
/* Layout: sticky header with logo trio and scrolling pill nav; hero with the Ciremai ridge; cards in an auto-fill grid; bottom-right help button always reachable. */
/* Type: Bricolage Grotesque for display, Plus Jakarta Sans for body. Color: sunny gold, fresh teal, sky blue and coral on an airy light ground. */
:root{
  --bg:#f3fbfe; --surface:#ffffff; --surface2:#e4f3fa; --ink:#14284b; --muted:#465b7a; --line:#d3e7f1;
  --primary:#0b7d78; --on-primary:#ffffff; --brand:#0a6aa1; --gold:#ffc83d;
  --danger:#c4382d; --on-danger:#ffffff; --danger-bg:#ffe8e4;
  --ok:#12703f; --ok-bg:#dcf6e8; --sky:#1f86d1; --sky-bg:#e0f1ff; --warn:#7a5200; --warn-bg:#fff0c2;
  --hg:linear-gradient(160deg,#d6f1ff 0%,#e6f9ef 52%,#fff2c4 100%);
  --rg1:#bfe8d5; --rg2:#b5dcf5; --glow:rgba(255,200,61,.14); --glow2:rgba(31,134,209,.09);
  --shadow:0 2px 4px rgba(20,40,75,.05),0 12px 30px rgba(31,134,209,.13);
  --fd:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --fb:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1b2e; --surface:#12283f; --surface2:#1b3652; --ink:#eaf6ff; --muted:#a9c2d9; --line:#26466a;
  --primary:#3fd6bd; --on-primary:#05261f; --brand:#8fd0ff; --gold:#ffd15c;
  --danger:#ff9a8f; --on-danger:#2e0d0a; --danger-bg:#3d1f27;
  --ok:#6fe0a2; --ok-bg:#123a2c; --sky:#7cc4ff; --sky-bg:#12365a; --warn:#ffd479; --warn-bg:#3d3212;
  --hg:linear-gradient(160deg,#0f2c4d 0%,#0e3a45 55%,#33301a 100%);
  --rg1:#12455a; --rg2:#16506e; --glow:rgba(255,200,61,.10); --glow2:rgba(63,214,189,.08);
  --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1b2e; --surface:#12283f; --surface2:#1b3652; --ink:#eaf6ff; --muted:#a9c2d9; --line:#26466a;
  --primary:#3fd6bd; --on-primary:#05261f; --brand:#8fd0ff; --gold:#ffd15c;
  --danger:#ff9a8f; --on-danger:#2e0d0a; --danger-bg:#3d1f27;
  --ok:#6fe0a2; --ok-bg:#123a2c; --sky:#7cc4ff; --sky-bg:#12365a; --warn:#ffd479; --warn-bg:#3d3212;
  --hg:linear-gradient(160deg,#0f2c4d 0%,#0e3a45 55%,#33301a 100%);
  --rg1:#12455a; --rg2:#16506e; --glow:rgba(255,200,61,.10); --glow2:rgba(63,214,189,.08);
  --shadow:0 2px 4px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);font-size:16px;line-height:1.6;background-color:var(--bg);background-image:radial-gradient(640px 420px at 100% 0,var(--glow),transparent 62%),radial-gradient(720px 520px at 0 38%,var(--glow2),transparent 62%);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:60}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;letter-spacing:-.02em;margin:0 0 .5em;text-wrap:balance}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 1em}
a{color:var(--brand)}
img{max-width:100%}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{padding-block:34px}
.muted{color:var(--muted)}
.sm{font-size:.875rem}
.mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* header */
.bn{background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:.9rem;text-align:center}
.bn .wrap{padding-block:8px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .top{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0;flex:1}
.logos{display:flex;gap:5px;flex:none}
.logo{height:38px;width:38px;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(20,40,75,.22))}
.brand b{font-family:var(--fd);font-size:1.35rem;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--muted);line-height:1.2;margin-top:2px}
.ib{display:inline-flex;align-items:center;gap:6px;min-height:42px;min-width:42px;justify-content:center;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;padding:0 10px;text-decoration:none}
.nav{overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.nav::-webkit-scrollbar{display:none}
.nav .in{display:flex;gap:4px;width:max-content;min-width:100%;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav a{white-space:nowrap;padding:8px 13px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);text-decoration:none}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current=page]{background:var(--primary);color:var(--on-primary)}
@media(max-width:480px){.brand small,.ib .lbl{display:none}.logo{height:32px;width:32px}}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font:inherit;font-weight:700;font-size:.95rem;line-height:1.2;cursor:pointer;text-decoration:none;text-align:center}
.btn-p{background:var(--primary);color:var(--on-primary)}
.btn-s{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-g{background:transparent;color:var(--brand);border-color:var(--line)}
.btn-d{background:var(--danger);color:var(--on-danger)}
.btn-w{background:#fff;color:#15205a}
.btn-o{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--surface2);color:var(--brand)}
.bd.w{background:var(--warn-bg);color:var(--warn)}
.bd.o{background:var(--ok-bg);color:var(--ok)}
.bd.s{background:var(--sky-bg);color:var(--sky)}
.bd.d{background:var(--danger-bg);color:var(--danger)}
svg.i{flex:none;display:block}

/* hero */
.hero{background:var(--hg);color:var(--ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-90px;width:330px;height:330px;border-radius:50%;background:radial-gradient(circle at 42% 42%,#fff3b0 0,#ffd54a 46%,rgba(255,200,61,0) 70%);opacity:.9}
.hero::after{content:"";position:absolute;left:-90px;bottom:60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(47,191,143,.28),rgba(47,191,143,0) 68%)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;padding-block:44px 130px;align-items:center;position:relative;z-index:1}
@media(max-width:840px){.hero .wrap{grid-template-columns:1fr;padding-block:30px 120px}}
.hero .kick{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);background:var(--surface);padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:16px}
.hero h1{font-size:clamp(3.2rem,10vw,6rem);font-weight:800;line-height:.92;letter-spacing:-.04em;margin:0 0 16px;color:var(--ink)}
.hero h1 span{background:linear-gradient(transparent 60%,var(--gold) 60% 90%,transparent 90%);padding-inline:.04em}
.hero p.lead{font-size:1.15rem;max-width:32em;color:var(--ink)}
.hero .chips .chip{background:var(--surface);cursor:default;box-shadow:0 2px 8px rgba(20,40,75,.08)}
.ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:120px;display:block}
.ridge path:nth-child(1){fill:var(--rg1)}
.ridge path:nth-child(2){fill:var(--rg2)}
.show{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:440px;margin-inline:auto;width:100%;align-items:end}
.show figure{margin:0;text-align:center}
.show .lt{aspect-ratio:1;display:grid;place-items:center;padding:2px}
.show img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(20,40,75,.28));animation:bob 5s ease-in-out infinite}
.show figure:nth-child(2) img{animation-delay:-1.6s}
.show figure:nth-child(3) img{animation-delay:-3.2s}
@keyframes bob{50%{transform:translateY(-8px)}}
.show figcaption{font-size:.74rem;font-weight:700;margin-top:8px;color:var(--ink);line-height:1.25}
.show figure:nth-child(2){transform:translateY(-10px)}

/* cards & grids */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.sh{box-shadow:var(--shadow)}
.g{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.tile{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.tile:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.tile .ico{flex:none;width:46px;height:46px;border-radius:14px;background:var(--surface2);color:var(--brand);display:grid;place-items:center}
.tile b{display:block;font-family:var(--fd);font-size:1.08rem;line-height:1.2}
.tile span.d{display:block;font-size:.86rem;color:var(--muted);margin-top:3px}
.tile.hot .ico{background:var(--danger-bg);color:var(--danger)}
.tile.cal .ico{background:var(--ok-bg);color:var(--ok)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px;margin-bottom:16px}
.head h2{margin:0}
.page{padding-block:28px 40px}
.page>.wrap>h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-bottom:.25em}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.ac{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.ac:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.ac h3{margin:0;font-size:1.12rem}
.ac p{margin:0;color:var(--muted);font-size:.92rem}
.ac .cov{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface2)}
.ac .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.pr{max-width:65ch}
.pr h3{margin-top:1.4em}
.pr ul{padding-left:1.2em;margin:0 0 1em}
.pr li{margin-bottom:.35em}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.tools .s{flex:1 1 240px;position:relative}
.tools .s svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.tools .s input{padding-left:40px}

/* forms */
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:110px}
.fld{margin-bottom:14px}
.hint{font-size:.82rem;color:var(--muted);margin-top:4px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
.ck{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.ck input{margin-top:5px}

/* callouts */
.co{border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--sky-bg);color:var(--ink);border:1px solid var(--line)}
.co.w{background:var(--warn-bg)}
.co.d{background:var(--danger-bg);border-color:var(--danger)}
.co.o{background:var(--ok-bg)}
.co>div{min-width:0}
.co p:last-child{margin:0}

/* modal, toast */
.ov{position:fixed;inset:0;background:rgba(8,12,30,.62);z-index:100;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex}
.md{background:var(--surface);color:var(--ink);border-radius:20px;max-width:780px;width:100%;margin:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);min-width:0}
.md .x{float:right;margin:-6px -6px 8px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:120;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#cover{position:fixed;inset:0;z-index:200;background:#fff;color:#222;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer}

/* quiz & mental health */
.pg{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.pg>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:10px;cursor:pointer;min-height:48px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.no{border-color:var(--danger);background:var(--danger-bg)}
.opt.sel{border-color:var(--primary);background:var(--surface2)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 6px}
.meter i{display:block;height:12px;border-radius:6px;background:var(--surface2)}
.meter i.on{background:var(--primary)}
.meter i.cur{outline:3px solid var(--sky);outline-offset:2px;background:var(--primary)}
.mlab{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2}
.big{font-family:var(--fd);font-size:3rem;font-weight:800;line-height:1}
.bar{display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;font-size:.85rem;margin:6px 0}
.bar .t{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--primary);border-radius:7px}
@media(max-width:480px){.bar{grid-template-columns:96px 1fr 30px}}

/* calm corner */
.br{width:210px;height:210px;max-width:70vw;max-height:70vw;border-radius:50%;margin:10px auto;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,var(--sky-bg),var(--surface2));border:2px solid var(--sky);transform:scale(.6);font-weight:700}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.72rem;font-weight:600;cursor:pointer;line-height:1.2;text-align:center}
.mood[aria-pressed=true]{border-color:var(--primary);background:var(--surface2);outline:2px solid var(--primary)}
.kartu{font-family:var(--fd);font-size:1.5rem;font-weight:700;line-height:1.25;text-align:center;padding:26px 14px;min-height:130px;display:grid;place-items:center}

/* program */
.tl{display:grid;gap:12px}
.ev{display:grid;grid-template-columns:78px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ev .dt{text-align:center;border-radius:12px;background:var(--surface2);padding:8px 4px;align-self:start}
.ev .dt b{display:block;font-family:var(--fd);font-size:1.7rem;line-height:1}
.ev .dt span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ev h3{margin:0 0 4px;font-size:1.1rem}

/* gallery, team */
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.gal button{padding:0;border:0;background:var(--surface2);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:var(--ink);display:block}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gal span{display:block;padding:8px 10px;font-size:.84rem;font-weight:600}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--surface2);display:grid;place-items:center;color:var(--brand);font-family:var(--fd);font-weight:800;font-size:1.4rem;flex:none}
.pv{max-width:200px;border-radius:10px;display:block;margin-bottom:8px}

/* faq */
details.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:10px}
details.q summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--brand)}
details.q[open] summary::after{content:"\2212"}
details.q .a{padding:0 16px 14px;color:var(--ink)}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:thin}
.tabs button{flex:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.tb{border-collapse:collapse;width:100%;font-size:.9rem}
.tb th,.tb td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tb th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{font-family:var(--fd);font-size:2rem;font-weight:800;display:block;line-height:1}
.stat span{font-size:.82rem;color:var(--muted)}

/* footer */
.ft{background:var(--surface);border-top:1px solid var(--line);margin-top:20px}
.ft .wrap{padding-block:30px 40px;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.ft h4{font-size:1rem;margin-bottom:.4em}

<script type="application/json" id="sg-seed" data-sg>{"berita":[{"id":"d-ber-3","isi":"Tulis laporan kegiatanmu di sini: apa kegiatannya, di mana, kapan, siapa yang hadir, dan apa hasilnya.\n\nTambahkan foto sampul dari Dasbor Pengelola supaya beritamu lebih menarik.","judul":"Contoh Berita: Duta GenRe Kuningan Hadir di Sekolah","kategori":"Kegiatan","ringkas":"Ini contoh tulisan. Ganti atau hapus lewat Dasbor Pengelola.","tgl":"2026-11-03"}],"edukasi":[{"id":"d-dig-1","isi":"Dunia maya menyenangkan, tetapi ada risiko yang perlu kamu kenali.\n\n## Tanda bahaya\n\n- Orang yang baru kenal meminta foto pribadi, atau meminta hubungan dirahasiakan dari orang tua.\n- Ancaman menyebar foto atau videomu bila tidak menuruti permintaan (sextortion).\n- Hadiah atau uang yang ditawarkan sebagai imbalan.\n\n## Yang sebaiknya dilakukan\n\n- Jangan kirim foto atau video yang bisa disalahgunakan, walau kepada pacar.\n- Jika diperas: jangan bayar, simpan bukti, blokir, lalu ceritakan kepada orang dewasa dan laporkan.\n- Jaga data pribadi: alamat, sekolah, nomor ponsel, kata sandi.\n\n## Cek hoaks\n\nPeriksa sumber, tanggal, dan apakah media terpercaya memberitakan hal yang sama sebelum membagikan.","judul":"Aman di Dunia Digital: Grooming, Sextortion, dan Hoaks","kat":"digital","menit":4,"ringkas":"Menjaga data pribadi, mengenali bujuk rayu orang asing online, dan memeriksa kebenaran informasi.","tgl":"2026-11-03"},{"id":"d-gizi-1","isi":"Remaja putri hari ini adalah calon ibu esok hari. Gizi yang baik sejak remaja membantu bayi tumbuh sehat dan mencegah stunting, yaitu kondisi gagal tumbuh pada anak akibat kekurangan gizi kronis.\n\n## Isi Piringku\n\n- Pada tiap kali makan, isi separuh piring dengan sayur dan buah.\n- Separuh lainnya diisi makanan pokok dan lauk pauk (telur, ikan, tempe, tahu, daging).\n- Kurangi gula, garam, lemak, dan minuman manis kemasan.\n\n## Anemia dan tablet tambah darah\n\nAnemia membuat badan mudah lelah dan sulit konsentrasi. Program Kemenkes menganjurkan remaja putri minum tablet tambah darah (TTD) satu tablet setiap minggu. Ikuti petunjuk dari Puskesmas atau sekolahmu, dan minum sesudah makan.\n\nSarapan, minum air putih cukup, dan tidur cukup juga bagian dari gizi yang baik.","judul":"Isi Piringku dan Tablet Tambah Darah untuk Remaja Putri","kat":"gizi","menit":3,"ringkas":"Gizi seimbang remaja, anemia, dan hubungannya dengan pencegahan stunting generasi berikutnya.","tgl":"2026-11-03"},{"id":"d-kek-1","isi":"Bullying adalah perilaku menyakiti yang dilakukan berulang oleh pihak yang merasa lebih kuat. Bentuknya bisa fisik, verbal (ejekan, hinaan), sosial (mengucilkan, menyebar gosip), dan siber (hinaan atau penyebaran aib lewat media sosial).\n\n## Jika kamu korban\n\n- Ingat: itu bukan salahmu.\n- Simpan bukti seperti tangkapan layar dan catat waktu kejadian.\n- Ceritakan kepada orang tua, wali kelas, atau guru BK.\n- Blokir dan laporkan akun pelaku untuk bullying siber.\n\n## Jika kamu saksi\n\n- Jangan ikut menertawakan atau menyebarkan.\n- Dekati korban dan tawarkan dukungan.\n- Laporkan kepada guru atau pihak sekolah.\n\nSekolah wajib memiliki Tim Pencegahan dan Penanganan Kekerasan (TPPK) sesuai Permendikbudristek Nomor 46 Tahun 2023. Kamu berhak mendapat perlindungan.","judul":"Bullying: Kenali, Hentikan, Laporkan","kat":"kekerasan","menit":3,"ringkas":"Bentuk-bentuk bullying, dampaknya, dan langkah yang bisa dilakukan korban maupun saksi.","tgl":"2026-11-03"},{"id":"d-kek-2","isi":"Persetujuan (consent) harus diberikan secara sadar, sukarela, dan bisa ditarik kapan saja. Diam atau tidak melawan bukan berarti setuju.\n\n## Bentuk kekerasan seksual\n\n- Sentuhan, ciuman, atau pelukan yang tidak diinginkan.\n- Komentar atau candaan bernada seksual yang membuat tidak nyaman.\n- Memaksa mengirim atau menyebarkan foto atau video intim.\n- Ancaman atau paksaan untuk melakukan hubungan seksual.\n\n## Jika terjadi padamu\n\n- Menjauhlah ke tempat aman dan hubungi orang yang kamu percaya.\n- Jangan menyalahkan dirimu. Pelaku yang bersalah.\n- Simpan bukti dan jangan mandi atau mengganti pakaian dulu bila perlu pemeriksaan medis.\n- Hubungi UPTD PPA lewat tombol Butuh bantuan, atau datangi Polisi.\n\nUndang-Undang Nomor 12 Tahun 2022 tentang Tindak Pidana Kekerasan Seksual (UU TPKS) melindungi korban dan menjamin hak atas pendampingan serta pemulihan.","judul":"Pelecehan dan Kekerasan Seksual: Kamu Tidak Sendiri","kat":"kekerasan","menit":4,"ringkas":"Mengenali persetujuan (consent), bentuk kekerasan seksual, dan ke mana mencari pertolongan.","tgl":"2026-11-03"},{"id":"d-kespro-1","isi":"Pubertas adalah masa ketika tubuh berubah dari anak-anak menuju dewasa. Pada perempuan umumnya dimulai sekitar usia 8 sampai 13 tahun, pada laki-laki sekitar 9 sampai 14 tahun. Waktunya berbeda pada tiap orang, dan itu wajar.\n\n## Yang terjadi pada tubuh\n\n- Perempuan: payudara tumbuh, mulai menstruasi, pinggul melebar.\n- Laki-laki: suara menjadi berat, tumbuh kumis dan jakun, mengalami mimpi basah.\n- Keduanya: tumbuh rambut di area tertentu, kulit lebih berminyak, emosi mudah naik turun.\n\n## Kebiasaan sehat\n\n- Mandi dua kali sehari dan ganti pakaian dalam setiap hari.\n- Bersihkan area kewanitaan dari depan ke belakang, hindari sabun berpewangi kuat.\n- Ganti pembalut setiap 4 sampai 6 jam.\n- Tanyakan hal yang membuatmu bingung kepada orang dewasa tepercaya, tenaga kesehatan, atau konselor PIK-Remaja.","judul":"Mengenal Tubuhmu: Pubertas dan Kesehatan Reproduksi","kat":"kespro","menit":3,"ringkas":"Perubahan tubuh saat pubertas itu normal. Kenali tanda-tandanya dan cara merawat diri.","tgl":"2026-11-03"},{"id":"d-kespro-2","isi":"Siklus menstruasi dihitung dari hari pertama haid sampai sehari sebelum haid berikutnya. Pada remaja, siklus umumnya 21 sampai 35 hari dan haid berlangsung 2 sampai 7 hari. Di tahun-tahun awal, siklus yang belum teratur masih sering terjadi.\n\n## Nyeri haid\n\nNyeri ringan sampai sedang di perut bagian bawah itu umum. Kompres hangat, istirahat cukup, dan olahraga ringan biasanya membantu.\n\n## Periksakan ke Puskesmas atau dokter bila\n\n- Nyeri begitu hebat sampai tidak bisa sekolah atau beraktivitas.\n- Darah sangat banyak, misalnya pembalut penuh dalam waktu kurang dari 2 jam.\n- Belum haid sama sekali sampai usia 15 tahun.\n- Haid berhenti lama setelah sebelumnya teratur.\n\nPuskesmas punya layanan PKPR (Pelayanan Kesehatan Peduli Remaja) yang ramah remaja.","judul":"Menstruasi: Normal atau Perlu Diperiksa?","kat":"kespro","menit":3,"ringkas":"Siklus, lama haid, dan tanda yang sebaiknya diperiksakan ke tenaga kesehatan.","tgl":"2026-11-03"},{"id":"d-kespro-3","isi":"Program GenRe mengajak remaja menunda hubungan seksual sampai menikah. Alasannya sederhana: ini cara paling pasti untuk terhindar dari kehamilan yang tidak direncanakan dan infeksi menular seksual (IMS), termasuk HIV.\n\n## Fakta yang perlu kamu tahu\n\n- Kehamilan bisa terjadi pada hubungan seksual pertama.\n- IMS sering tidak bergejala, jadi orang bisa menularkan tanpa sadar.\n- Kamu berhak berkata TIDAK, dan pasangan yang baik menghargai itu.\n\n## Ciri hubungan yang sehat\n\n- Saling menghormati batas satu sama lain.\n- Tidak ada ancaman, paksaan, atau kontrol berlebihan.\n- Kamu tetap bebas berteman, belajar, dan jadi dirimu sendiri.\n\nJika kamu merasa berisiko atau butuh informasi, datanglah ke layanan PKPR di Puskesmas. Tenaga kesehatan wajib menjaga kerahasiaan dan tidak akan menghakimi.","judul":"Pacaran Sehat, Kehamilan, dan Infeksi Menular Seksual","kat":"kespro","menit":4,"ringkas":"Fakta penting tentang risiko hubungan seksual di usia remaja dan cara menjaga diri.","tgl":"2026-11-03"},{"id":"d-md-1","isi":"Generasi Berencana adalah remaja yang punya rencana untuk hidupnya. Rencana tidak harus sempurna, yang penting dimulai.\n\n## Lima langkah\n\n- Kenali dirimu: apa yang kamu suka, kuasai, dan pedulikan.\n- Tuliskan tujuan untuk 1 tahun dan 5 tahun ke depan, mulai dari pendidikan dan keterampilan.\n- Pecah menjadi langkah kecil bulanan dan tentukan satu kebiasaan baru untuk dimulai minggu ini.\n- Jaga kesehatan fisik dan mentalmu karena itu modal utama.\n- Bangun jejaring: bergabung dengan PIK-R, organisasi sekolah, atau komunitas yang positif.\n\nTentukan juga kapan kamu siap berkeluarga. Rencana yang matang membuat keluarga yang kelak kamu bangun lebih sehat dan sejahtera.","judul":"Merancang Masa Depan: Lima Langkah Remaja Berencana","kat":"masadepan","menit":3,"ringkas":"Menyusun tujuan, keterampilan, dan rencana hidup sebagai bagian dari Generasi Berencana.","tgl":"2026-11-03"},{"id":"d-mental-1","isi":"Kesehatan mental adalah kondisi ketika seseorang mampu mengenali kemampuannya, mengelola tekanan sehari-hari, belajar atau bekerja dengan baik, dan berkontribusi pada lingkungannya. Sama seperti tubuh, pikiran dan perasaan juga bisa sakit dan bisa dipulihkan.\n\n## Tanda yang perlu diperhatikan\n\n- Sedih, cemas, atau mudah marah hampir setiap hari selama lebih dari dua minggu.\n- Kehilangan minat pada hal yang dulu disukai.\n- Sulit tidur, atau tidur terlalu banyak.\n- Nilai atau semangat belajar menurun drastis.\n- Menarik diri dari teman dan keluarga.\n\n## Apa yang bisa dilakukan\n\n- Ceritakan pada orang yang kamu percaya: orang tua, guru BK, kakak, atau sahabat.\n- Jaga rutinitas tidur, makan, dan bergerak.\n- Bicara dengan tenaga profesional bila perasaan itu mengganggu aktivitasmu.\n\nMeminta bantuan bukan tanda kelemahan. Itu langkah berani untuk merawat diri.","judul":"Kesehatan Mental Bukan Soal Lemah atau Kuat","kat":"mental","menit":3,"ringkas":"Memahami kesehatan mental, tanda-tanda yang perlu diperhatikan, dan kapan mencari bantuan.","tgl":"2026-11-03"},{"id":"d-mental-2","isi":"Tekanan ujian, tugas, dan pertemanan itu nyata. Media sosial sering menambahnya karena kita hanya melihat sisi terbaik hidup orang lain.\n\n## Lima kebiasaan kecil yang membantu\n\n- Tidur 8 sampai 10 jam per malam. Simpan ponsel jauh dari tempat tidur.\n- Pecah tugas besar menjadi langkah kecil dan kerjakan satu per satu.\n- Bergerak minimal 30 menit per hari, jalan kaki pun cukup.\n- Batasi waktu scroll, terutama sebelum tidur.\n- Sisihkan waktu untuk hal yang kamu sukai tanpa rasa bersalah.\n\n## Coba teknik napas\n\nTarik napas 4 hitungan, tahan 4 hitungan, hembuskan pelan 6 hitungan. Ulangi 5 kali. Kamu bisa mencobanya langsung di menu Pojok Tenang.","judul":"Mengelola Stres Sekolah dan Media Sosial","kat":"mental","menit":3,"ringkas":"Tips praktis menghadapi tekanan belajar, perbandingan di media sosial, dan kurang tidur.","tgl":"2026-11-03"},{"id":"d-mental-3","isi":"Kamu tidak perlu menjadi psikolog untuk menolong temanmu. Kehadiran dan telinga yang mau mendengar sudah sangat berarti.\n\n## Yang bisa kamu lakukan\n\n- Ajak bicara di tempat yang nyaman dan tanyakan kabarnya dengan tulus.\n- Dengarkan tanpa menyela, menghakimi, atau buru-buru memberi nasihat.\n- Katakan: \"Terima kasih sudah cerita. Aku ada di sini.\"\n- Dorong dia berbicara dengan orang dewasa tepercaya atau tenaga profesional.\n\n## Jika temanmu menyebut ingin melukai diri atau mengakhiri hidup\n\nTanggapi dengan serius. Jangan berjanji merahasiakannya. Segera libatkan orang dewasa tepercaya, dan hubungi UPTD PPA Kabupaten Kuningan di 082116890831. Jika ada bahaya langsung, bawa ke IGD terdekat.\n\nJaga dirimu juga. Menemani teman bisa melelahkan, dan kamu pun boleh bercerita kepada orang dewasa.","judul":"Cara Menemani Temanmu yang Sedang Berat","kat":"mental","menit":3,"ringkas":"Langkah sederhana untuk menjadi pendengar yang aman dan mengajak teman mencari bantuan.","tgl":"2026-11-03"},{"id":"d-napza-1","isi":"Napza adalah singkatan dari Narkotika, Psikotropika, dan Zat Adiktif lainnya. Zat ini memengaruhi otak, mudah membuat ketergantungan, dan mengganggu belajar, kesehatan, serta hubungan dengan keluarga.\n\n## Rokok dan vape\n\nRokok dan rokok elektrik (vape) umumnya mengandung nikotin yang membuat kecanduan. Vape bukan pilihan yang aman. Otak remaja masih berkembang sehingga lebih rentan terhadap kecanduan.\n\n## Cara menolak ajakan\n\n- Katakan singkat dan tegas: \"Enggak, makasih.\"\n- Alihkan: \"Yuk main saja,\" atau pergi dari situasi itu.\n- Cari teman yang menghargai keputusanmu.\n\n## Jika kamu atau temanmu sudah terlanjur\n\nBicarakan dengan orang dewasa tepercaya. Pecandu yang melapor secara sukarela dapat dibantu melalui rehabilitasi di Institusi Penerima Wajib Lapor (IPWL) atau lewat Badan Narkotika Nasional.","judul":"Napza, Rokok, dan Vape: Jangan Coba-coba","kat":"napza","menit":3,"ringkas":"Apa itu Napza, kenapa rokok elektrik tetap berbahaya, dan cara menolak ajakan teman.","tgl":"2026-11-03"},{"id":"d-pup-1","isi":"Pendewasaan Usia Perkawinan (PUP) adalah upaya menunda pernikahan sampai siap secara fisik, mental, dan ekonomi.\n\n## Aturannya\n\n- Undang-Undang Nomor 16 Tahun 2019 menetapkan batas minimal usia perkawinan 19 tahun untuk perempuan dan laki-laki.\n- BKKBN menganjurkan usia ideal menikah minimal 21 tahun untuk perempuan dan 25 tahun untuk laki-laki.\n\n## Mengapa menunggu\n\n- Tubuh perempuan yang masih tumbuh lebih berisiko mengalami komplikasi kehamilan dan persalinan.\n- Anak yang lahir dari ibu yang terlalu muda lebih berisiko lahir prematur atau mengalami stunting.\n- Pendidikan, keterampilan, dan penghasilan yang mapan membuat keluarga lebih tangguh.\n- Kematangan emosi membantu pasangan mengelola konflik tanpa kekerasan.\n\nGenerasi Berencana berarti merencanakan hidup: sekolah, karier, baru kemudian keluarga.","judul":"Pendewasaan Usia Perkawinan: Kenapa Menunggu Itu Keren","kat":"pup","menit":3,"ringkas":"Batas usia menikah menurut hukum dan anjuran BKKBN untuk kesiapan fisik, mental, dan ekonomi.","tgl":"2026-11-03"}],"faq":[{"a":"GenRe berarti Generasi Berencana, program BKKBN untuk remaja agar merencanakan kehidupannya dengan matang, termasuk pendidikan, karier, dan kesiapan berkeluarga.","id":"d-faq-1","kategori":"Umum","q":"Apa itu GenRe?"},{"a":"Pusat Informasi dan Konseling Remaja (PIK-R) adalah wadah kegiatan yang dikelola dari, oleh, dan untuk remaja untuk berbagi informasi dan konseling tentang kesehatan reproduksi dan kehidupan remaja.","id":"d-faq-2","kategori":"Umum","q":"Apa itu PIK-Remaja?"},{"a":"Duta GenRe menjadi teladan dan mitra sebaya yang menyebarkan informasi positif tentang kehidupan remaja yang sehat, terencana, dan bertanggung jawab di lingkungannya.","id":"d-faq-3","kategori":"Umum","q":"Apa tugas Duta GenRe?"},{"a":"Bukan. Hasilnya hanya skrining awal untuk membantumu mengenali kondisi. Diagnosis hanya bisa diberikan oleh psikolog atau dokter setelah pemeriksaan langsung.","id":"d-faq-4","kategori":"Cek Mental","q":"Apakah hasil Cek Kesehatan Mental sama dengan diagnosis?"},{"a":"Hasil dan riwayatmu disimpan hanya di perangkat ini. Kamu bisa memilih mengirim ringkasan skor tanpa nama untuk statistik program, tetapi itu tidak wajib.","id":"d-faq-5","kategori":"Cek Mental","q":"Apakah jawabanku disimpan?"},{"a":"Hubungi UPTD PPA Kabupaten Kuningan lewat tombol Butuh bantuan di pojok kanan bawah.","id":"d-faq-6","kategori":"Layanan","q":"Ke mana aku harus melapor jika mengalami kekerasan?"},{"a":"Puskesmas dengan layanan PKPR menyediakan konseling remaja. Kamu juga bisa ngobrol dengan admin Sahabat lewat menu Chat Admin.","id":"d-faq-7","kategori":"Layanan","q":"Apakah ada konseling gratis?"},{"a":"Tidak. Tulisanmu tersimpan di perangkatmu sendiri dan bisa kamu hapus kapan saja. Tulisan hanya sampai ke pengelola jika kamu sendiri memilih mengirimnya, dan tetap tanpa nama.","id":"d-faq-8","kategori":"Umum","q":"Apakah keluh kesahku dibaca orang lain?"}],"program":[{"deskripsi":"Penyuluhan pendewasaan usia perkawinan dan kesehatan reproduksi untuk siswa.","id":"d-prog-1","judul":"Contoh: Sosialisasi GenRe di SMA/SMK","status":"rencana","tempat":"Sekolah mitra (isi nama sekolah)","tgl":"2026-11-20"},{"deskripsi":"Kampanye poster dan video pendek di media sosial.","id":"d-prog-3","judul":"Contoh: Kampanye Anti Bullying","status":"rencana","tempat":"Online dan sekolah","tgl":"2026-12-18"},{"deskripsi":"Melatih remaja menjadi teman cerita yang aman bagi sebayanya.","id":"d-prog-4","judul":"Contoh: Pelatihan Pendidik Sebaya","status":"selesai","tempat":"Kuningan","tgl":"2026-10-15"}],"settings":[{"banner":"","email":"","id":"site","ig":"","sekTelp":"082116890831","sekretariat":"Jl. RE. Martadinata, Ancaran, Kec. Kuningan, Kab. Kuningan, Jawa Barat 45514","tagline":"Ruang aman remaja Kuningan untuk belajar, bercerita, dan berani minta bantuan.","uptdAlamat":"Jl. RE. Martadinata, Ancaran, Kec. Kuningan, Kab. Kuningan 45514 (DPPKBP3A)","uptdJam":"","uptdNama":"UPTD PPA Kabupaten Kuningan","uptdTelp":"082116890831","uptdWa":"082116890831","wa":"085798814524"}]}</script>

{id:'d-kespro-1',kat:'kespro',judul:'Mengenal Tubuhmu: Pubertas dan Kesehatan Reproduksi',menit:3,tgl:'2026-11-03',
 ringkas:'Perubahan tubuh saat pubertas itu normal. Kenali tanda-tandanya dan cara merawat diri.',
 isi:J('Pubertas adalah masa ketika tubuh berubah dari anak-anak menuju dewasa. Pada perempuan umumnya dimulai sekitar usia 8 sampai 13 tahun, pada laki-laki sekitar 9 sampai 14 tahun. Waktunya berbeda pada tiap orang, dan itu wajar.',
 '## Yang terjadi pada tubuh',
 '- Perempuan: payudara tumbuh, mulai menstruasi, pinggul melebar.\n- Laki-laki: suara menjadi berat, tumbuh kumis dan jakun, mengalami mimpi basah.\n- Keduanya: tumbuh rambut di area tertentu, kulit lebih berminyak, emosi mudah naik turun.',
 '## Kebiasaan sehat',
 '- Mandi dua kali sehari dan ganti pakaian dalam setiap hari.\n- Bersihkan area kewanitaan dari depan ke belakang, hindari sabun berpewangi kuat.\n- Ganti pembalut setiap 4 sampai 6 jam.\n- Tanyakan hal yang membuatmu bingung kepada orang dewasa tepercaya, tenaga kesehatan, atau konselor PIK-Remaja.')},
{id:'d-kespro-2',kat:'kespro',judul:'Menstruasi: Normal atau Perlu Diperiksa?',menit:3,tgl:'2026-11-03',
 ringkas:'Siklus, lama haid, dan tanda yang sebaiknya diperiksakan ke tenaga kesehatan.',
 isi:J('Siklus menstruasi dihitung dari hari pertama haid sampai sehari sebelum haid berikutnya. Pada remaja, siklus umumnya 21 sampai 35 hari dan haid berlangsung 2 sampai 7 hari. Di tahun-tahun awal, siklus yang belum teratur masih sering terjadi.',
 '## Nyeri haid',
 'Nyeri ringan sampai sedang di perut bagian bawah itu umum. Kompres hangat, istirahat cukup, dan olahraga ringan biasanya membantu.',
 '## Periksakan ke Puskesmas atau dokter bila',
 '- Nyeri begitu hebat sampai tidak bisa sekolah atau beraktivitas.\n- Darah sangat banyak, misalnya pembalut penuh dalam waktu kurang dari 2 jam.\n- Belum haid sama sekali sampai usia 15 tahun.\n- Haid berhenti lama setelah sebelumnya teratur.',
 'Puskesmas punya layanan PKPR (Pelayanan Kesehatan Peduli Remaja) yang ramah remaja.')},
{id:'d-kespro-3',kat:'kespro',judul:'Pacaran Sehat, Kehamilan, dan Infeksi Menular Seksual',menit:4,tgl:'2026-11-03',
 ringkas:'Fakta penting tentang risiko hubungan seksual di usia remaja dan cara menjaga diri.',
 isi:J('Program GenRe mengajak remaja menunda hubungan seksual sampai menikah. Alasannya sederhana: ini cara paling pasti untuk terhindar dari kehamilan yang tidak direncanakan dan infeksi menular seksual (IMS), termasuk HIV.',
 '## Fakta yang perlu kamu tahu',
 '- Kehamilan bisa terjadi pada hubungan seksual pertama.\n- IMS sering tidak bergejala, jadi orang bisa menularkan tanpa sadar.\n- Kamu berhak berkata TIDAK, dan pasangan yang baik menghargai itu.',
 '## Ciri hubungan yang sehat',
 '- Saling menghormati batas satu sama lain.\n- Tidak ada ancaman, paksaan, atau kontrol berlebihan.\n- Kamu tetap bebas berteman, belajar, dan jadi dirimu sendiri.',
 'Jika kamu merasa berisiko atau butuh informasi, datanglah ke layanan PKPR di Puskesmas. Tenaga kesehatan wajib menjaga kerahasiaan dan tidak akan menghakimi.')},
{id:'d-mental-1',kat:'mental',judul:'Kesehatan Mental Bukan Soal Lemah atau Kuat',menit:3,tgl:'2026-11-03',
 ringkas:'Memahami kesehatan mental, tanda-tanda yang perlu diperhatikan, dan kapan mencari bantuan.',
 isi:J('Kesehatan mental adalah kondisi ketika seseorang mampu mengenali kemampuannya, mengelola tekanan sehari-hari, belajar atau bekerja dengan baik, dan berkontribusi pada lingkungannya. Sama seperti tubuh, pikiran dan perasaan juga bisa sakit dan bisa dipulihkan.',
 '## Tanda yang perlu diperhatikan',
 '- Sedih, cemas, atau mudah marah hampir setiap hari selama lebih dari dua minggu.\n- Kehilangan minat pada hal yang dulu disukai.\n- Sulit tidur, atau tidur terlalu banyak.\n- Nilai atau semangat belajar menurun drastis.\n- Menarik diri dari teman dan keluarga.',
 '## Apa yang bisa dilakukan',
 '- Ceritakan pada orang yang kamu percaya: orang tua, guru BK, kakak, atau sahabat.\n- Jaga rutinitas tidur, makan, dan bergerak.\n- Bicara dengan tenaga profesional bila perasaan itu mengganggu aktivitasmu.',
 'Meminta bantuan bukan tanda kelemahan. Itu langkah berani untuk merawat diri.')},
{id:'d-mental-2',kat:'mental',judul:'Mengelola Stres Sekolah dan Media Sosial',menit:3,tgl:'2026-11-03',
 ringkas:'Tips praktis menghadapi tekanan belajar, perbandingan di media sosial, dan kurang tidur.',
 isi:J('Tekanan ujian, tugas, dan pertemanan itu nyata. Media sosial sering menambahnya karena kita hanya melihat sisi terbaik hidup orang lain.',
 '## Lima kebiasaan kecil yang membantu',
 '- Tidur 8 sampai 10 jam per malam. Simpan ponsel jauh dari tempat tidur.\n- Pecah tugas besar menjadi langkah kecil dan kerjakan satu per satu.\n- Bergerak minimal 30 menit per hari, jalan kaki pun cukup.\n- Batasi waktu scroll, terutama sebelum tidur.\n- Sisihkan waktu untuk hal yang kamu sukai tanpa rasa bersalah.',
 '## Coba teknik napas',
 'Tarik napas 4 hitungan, tahan 4 hitungan, hembuskan pelan 6 hitungan. Ulangi 5 kali. Kamu bisa mencobanya langsung di menu Pojok Tenang.')},
{id:'d-mental-3',kat:'mental',judul:'Cara Menemani Temanmu yang Sedang Berat',menit:3,tgl:'2026-11-03',
 ringkas:'Langkah sederhana untuk menjadi pendengar yang aman dan mengajak teman mencari bantuan.',
 isi:J('Kamu tidak perlu menjadi psikolog untuk menolong temanmu. Kehadiran dan telinga yang mau mendengar sudah sangat berarti.',
 '## Yang bisa kamu lakukan',
 '- Ajak bicara di tempat yang nyaman dan tanyakan kabarnya dengan tulus.\n- Dengarkan tanpa menyela, menghakimi, atau buru-buru memberi nasihat.\n- Katakan: "Terima kasih sudah cerita. Aku ada di sini."\n- Dorong dia berbicara dengan orang dewasa tepercaya atau tenaga profesional.',
 '## Jika temanmu menyebut ingin melukai diri atau mengakhiri hidup',
 'Tanggapi dengan serius. Jangan berjanji merahasiakannya. Segera libatkan orang dewasa tepercaya, dan hubungi UPTD PPA Kabupaten Kuningan di 082116890831. Jika ada bahaya langsung, bawa ke IGD terdekat.',
 'Jaga dirimu juga. Menemani teman bisa melelahkan, dan kamu pun boleh bercerita kepada orang dewasa.')},
{id:'d-pup-1',kat:'pup',judul:'Pendewasaan Usia Perkawinan: Kenapa Menunggu Itu Keren',menit:3,tgl:'2026-11-03',
 ringkas:'Batas usia menikah menurut hukum dan anjuran BKKBN untuk kesiapan fisik, mental, dan ekonomi.',
 isi:J('Pendewasaan Usia Perkawinan (PUP) adalah upaya menunda pernikahan sampai siap secara fisik, mental, dan ekonomi.',
 '## Aturannya',
 '- Undang-Undang Nomor 16 Tahun 2019 menetapkan batas minimal usia perkawinan 19 tahun untuk perempuan dan laki-laki.\n- BKKBN menganjurkan usia ideal menikah minimal 21 tahun untuk perempuan dan 25 tahun untuk laki-laki.',
 '## Mengapa menunggu',
 '- Tubuh perempuan yang masih tumbuh lebih berisiko mengalami komplikasi kehamilan dan persalinan.\n- Anak yang lahir dari ibu yang terlalu muda lebih berisiko lahir prematur atau mengalami stunting.\n- Pendidikan, keterampilan, dan penghasilan yang mapan membuat keluarga lebih tangguh.\n- Kematangan emosi membantu pasangan mengelola konflik tanpa kekerasan.',
 'Generasi Berencana berarti merencanakan hidup: sekolah, karier, baru kemudian keluarga.')},
{id:'d-gizi-1',kat:'gizi',judul:'Isi Piringku dan Tablet Tambah Darah untuk Remaja Putri',menit:3,tgl:'2026-11-03',
 ringkas:'Gizi seimbang remaja, anemia, dan hubungannya dengan pencegahan stunting generasi berikutnya.',
 isi:J('Remaja putri hari ini adalah calon ibu esok hari. Gizi yang baik sejak remaja membantu bayi tumbuh sehat dan mencegah stunting, yaitu kondisi gagal tumbuh pada anak akibat kekurangan gizi kronis.',
 '## Isi Piringku',
 '- Pada tiap kali makan, isi separuh piring dengan sayur dan buah.\n- Separuh lainnya diisi makanan pokok dan lauk pauk (telur, ikan, tempe, tahu, daging).\n- Kurangi gula, garam, lemak, dan minuman manis kemasan.',
 '## Anemia dan tablet tambah darah',
 'Anemia membuat badan mudah lelah dan sulit konsentrasi. Program Kemenkes menganjurkan remaja putri minum tablet tambah darah (TTD) satu tablet setiap minggu. Ikuti petunjuk dari Puskesmas atau sekolahmu, dan minum sesudah makan.',
 'Sarapan, minum air putih cukup, dan tidur cukup juga bagian dari gizi yang baik.')},
{id:'d-napza-1',kat:'napza',judul:'Napza, Rokok, dan Vape: Jangan Coba-coba',menit:3,tgl:'2026-11-03',
 ringkas:'Apa itu Napza, kenapa rokok elektrik tetap berbahaya, dan cara menolak ajakan teman.',
 isi:J('Napza adalah singkatan dari Narkotika, Psikotropika, dan Zat Adiktif lainnya. Zat ini memengaruhi otak, mudah membuat ketergantungan, dan mengganggu belajar, kesehatan, serta hubungan dengan keluarga.',
 '## Rokok dan vape',
 'Rokok dan rokok elektrik (vape) umumnya mengandung nikotin yang membuat kecanduan. Vape bukan pilihan yang aman. Otak remaja masih berkembang sehingga lebih rentan terhadap kecanduan.',
 '## Cara menolak ajakan',
 '- Katakan singkat dan tegas: "Enggak, makasih."\n- Alihkan: "Yuk main saja," atau pergi dari situasi itu.\n- Cari teman yang menghargai keputusanmu.',
 '## Jika kamu atau temanmu sudah terlanjur',
 'Bicarakan dengan orang dewasa tepercaya. Pecandu yang melapor secara sukarela dapat dibantu melalui rehabilitasi di Institusi Penerima Wajib Lapor (IPWL) atau lewat Badan Narkotika Nasional.')},
{id:'d-kek-1',kat:'kekerasan',judul:'Bullying: Kenali, Hentikan, Laporkan',menit:3,tgl:'2026-11-03',
 ringkas:'Bentuk-bentuk bullying, dampaknya, dan langkah yang bisa dilakukan korban maupun saksi.',
 isi:J('Bullying adalah perilaku menyakiti yang dilakukan berulang oleh pihak yang merasa lebih kuat. Bentuknya bisa fisik, verbal (ejekan, hinaan), sosial (mengucilkan, menyebar gosip), dan siber (hinaan atau penyebaran aib lewat media sosial).',
 '## Jika kamu korban',
 '- Ingat: itu bukan salahmu.\n- Simpan bukti seperti tangkapan layar dan catat waktu kejadian.\n- Ceritakan kepada orang tua, wali kelas, atau guru BK.\n- Blokir dan laporkan akun pelaku untuk bullying siber.',
 '## Jika kamu saksi',
 '- Jangan ikut menertawakan atau menyebarkan.\n- Dekati korban dan tawarkan dukungan.\n- Laporkan kepada guru atau pihak sekolah.',
 'Sekolah wajib memiliki Tim Pencegahan dan Penanganan Kekerasan (TPPK) sesuai Permendikbudristek Nomor 46 Tahun 2023. Kamu berhak mendapat perlindungan.')},
{id:'d-kek-2',kat:'kekerasan',judul:'Pelecehan dan Kekerasan Seksual: Kamu Tidak Sendiri',menit:4,tgl:'2026-11-03',
 ringkas:'Mengenali persetujuan (consent), bentuk kekerasan seksual, dan ke mana mencari pertolongan.',
 isi:J('Persetujuan (consent) harus diberikan secara sadar, sukarela, dan bisa ditarik kapan saja. Diam atau tidak melawan bukan berarti setuju.',
 '## Bentuk kekerasan seksual',
 '- Sentuhan, ciuman, atau pelukan yang tidak diinginkan.\n- Komentar atau candaan bernada seksual yang membuat tidak nyaman.\n- Memaksa mengirim atau menyebarkan foto atau video intim.\n- Ancaman atau paksaan untuk melakukan hubungan seksual.',
 '## Jika terjadi padamu',
 '- Menjauhlah ke tempat aman dan hubungi orang yang kamu percaya.\n- Jangan menyalahkan dirimu. Pelaku yang bersalah.\n- Simpan bukti dan jangan mandi atau mengganti pakaian dulu bila perlu pemeriksaan medis.\n- Hubungi UPTD PPA lewat tombol Butuh bantuan, atau datangi Polisi.',
 'Undang-Undang Nomor 12 Tahun 2022 tentang Tindak Pidana Kekerasan Seksual (UU TPKS) melindungi korban dan menjamin hak atas pendampingan serta pemulihan.')},
{id:'d-dig-1',kat:'digital',judul:'Aman di Dunia Digital: Grooming, Sextortion, dan Hoaks',menit:4,tgl:'2026-11-03',
 ringkas:'Menjaga data pribadi, mengenali bujuk rayu orang asing online, dan memeriksa kebenaran informasi.',
 isi:J('Dunia maya menyenangkan, tetapi ada risiko yang perlu kamu kenali.',
 '## Tanda bahaya',
 '- Orang yang baru kenal meminta foto pribadi, atau meminta hubungan dirahasiakan dari orang tua.\n- Ancaman menyebar foto atau videomu bila tidak menuruti permintaan (sextortion).\n- Hadiah atau uang yang ditawarkan sebagai imbalan.',
 '## Yang sebaiknya dilakukan',
 '- Jangan kirim foto atau video yang bisa disalahgunakan, walau kepada pacar.\n- Jika diperas: jangan bayar, simpan bukti, blokir, lalu ceritakan kepada orang dewasa dan laporkan.\n- Jaga data pribadi: alamat, sekolah, nomor ponsel, kata sandi.',
 '## Cek hoaks',
 'Periksa sumber, tanggal, dan apakah media terpercaya memberitakan hal yang sama sebelum membagikan.')},
{id:'d-md-1',kat:'masadepan',judul:'Merancang Masa Depan: Lima Langkah Remaja Berencana',menit:3,tgl:'2026-11-03',
 ringkas:'Menyusun tujuan, keterampilan, dan rencana hidup sebagai bagian dari Generasi Berencana.',
 isi:J('Generasi Berencana adalah remaja yang punya rencana untuk hidupnya. Rencana tidak harus sempurna, yang penting dimulai.',
 '## Lima langkah',
 '- Kenali dirimu: apa yang kamu suka, kuasai, dan pedulikan.\n- Tuliskan tujuan untuk 1 tahun dan 5 tahun ke depan, mulai dari pendidikan dan keterampilan.\n- Pecah menjadi langkah kecil bulanan dan tentukan satu kebiasaan baru untuk dimulai minggu ini.\n- Jaga kesehatan fisik dan mentalmu karena itu modal utama.\n- Bangun jejaring: bergabung dengan PIK-R, organisasi sekolah, atau komunitas yang positif.',
 'Tentukan juga kapan kamu siap berkeluarga. Rencana yang matang membuat keluarga yang kelak kamu bangun lebih sehat dan sejahtera.')}
],

faq:[
{id:'d-faq-1',kategori:'Umum',q:'Apa itu GenRe?',a:'GenRe berarti Generasi Berencana, program BKKBN untuk remaja agar merencanakan kehidupannya dengan matang, termasuk pendidikan, karier, dan kesiapan berkeluarga.'},
{id:'d-faq-2',kategori:'Umum',q:'Apa itu PIK-Remaja?',a:'Pusat Informasi dan Konseling Remaja (PIK-R) adalah wadah kegiatan yang dikelola dari, oleh, dan untuk remaja untuk berbagi informasi dan konseling tentang kesehatan reproduksi dan kehidupan remaja.'},
{id:'d-faq-3',kategori:'Umum',q:'Apa tugas Duta GenRe?',a:'Duta GenRe menjadi teladan dan mitra sebaya yang menyebarkan informasi positif tentang kehidupan remaja yang sehat, terencana, dan bertanggung jawab di lingkungannya.'},
{id:'d-faq-4',kategori:'Cek Mental',q:'Apakah hasil Cek Kesehatan Mental sama dengan diagnosis?',a:'Bukan. Hasilnya hanya skrining awal untuk membantumu mengenali kondisi. Diagnosis hanya bisa diberikan oleh psikolog atau dokter setelah pemeriksaan langsung.'},
{id:'d-faq-5',kategori:'Cek Mental',q:'Apakah jawabanku disimpan?',a:'Hasil dan riwayatmu disimpan hanya di perangkat ini. Kamu bisa memilih mengirim ringkasan skor tanpa nama untuk statistik program, tetapi itu tidak wajib.'},
{id:'d-faq-6',kategori:'Layanan',q:'Ke mana aku harus melapor jika mengalami kekerasan?',a:'Hubungi UPTD PPA Kabupaten Kuningan lewat tombol Butuh bantuan di pojok kanan bawah.'},
{id:'d-faq-8',kategori:'Umum',q:'Apakah keluh kesahku dibaca orang lain?',a:'Tidak. Tulisanmu tersimpan di perangkatmu sendiri dan bisa kamu hapus kapan saja. Tulisan hanya sampai ke pengelola jika kamu sendiri memilih mengirimnya, dan tetap tanpa nama.'},
{id:'d-faq-7',kategori:'Layanan',q:'Apakah ada konseling gratis?',a:'Puskesmas dengan layanan PKPR menyediakan konseling remaja. Kamu juga bisa ngobrol dengan admin Sahabat lewat menu Chat Admin.'},
],

n otak remaja lebih rentan."},{"q":"Mencoba rokok atau vape sekali saja pasti tidak berbahaya.","o":["Benar","Salah"],"a":1,"k":"napza","e":"Salah. Zat adiktif dapat memicu ketergantungan, terutama pada otak remaja yang masih berkembang."},{"q":"Pecandu yang melapor secara sukarela dapat dibantu melalui...","o":["Institusi Penerima Wajib Lapor (IPWL)","Kantor pajak","Toko kelontong","Tidak ada bantuan"],"a":0,"k":"napza","e":"IPWL dan BNN menyediakan jalur rehabilitasi bagi yang melapor sukarela."},{"q":"Otak remaja yang masih berkembang membuatnya ... terhadap kecanduan.","o":["Lebih rentan","Kebal","Tidak terpengaruh","Lebih kuat"],"a":0,"k":"napza","e":"Karena otak masih berkembang, remaja lebih mudah mengalami ketergantungan."},{"q":"Temanmu sudah terlanjur memakai Napza. Langkah yang baik adalah...","o":["Mengejeknya","Mengajaknya bicara dengan orang dewasa tepercaya untuk mencari bantuan","Ikut mencoba agar kompak","Merahasiakannya selamanya"],"a":1,"k":"napza","e":"Dukungan dan akses ke bantuan profesional lebih menolong daripada menghakimi."},{"q":"Asap rokok hanya berbahaya bagi perokok itu sendiri.","o":["Benar","Salah"],"a":1,"k":"napza","e":"Salah. Asap rokok juga membahayakan orang di sekitarnya (perokok pasif)."},{"q":"Cara menolak ajakan yang singkat dan tegas adalah...","o":["Enggak, makasih","Mungkin nanti","Terserah kamu saja","Kasih aku waktu seminggu"],"a":0,"k":"napza","e":"Jawaban singkat dan tegas, lalu alihkan atau pergi, membuat kamu lebih aman dari tekanan teman."},{"q":"Mengejek dan mempermalukan seseorang di grup chat termasuk...","o":["Bullying siber","Belajar kelompok","Kerja bakti","Olahraga"],"a":0,"k":"aman","e":"Bullying siber adalah hinaan atau penyebaran aib lewat media sosial dan pesan."},{"q":"Diam atau tidak melawan berarti setuju.","o":["Benar","Salah"],"a":1,"k":"aman","e":"Salah. Persetujuan (consent) harus sadar, sukarela, dan bisa ditarik kapan saja."},{"q":"Undang-undang yang melindungi korban kekerasan seksual adalah..." function chart(series,labels,ymin,ymax,w=340,h=160){
 const L=32,R=10,T=10,B=26,iw=w-L-R,ih=h-T-B,n=labels.length;
 const x=i=>L+(n===1?iw/2:i*iw/(n-1));
 const y=v=>T+ih-(v-ymin)/(ymax-ymin)*ih;
 const step=Math.max(1,Math.round((ymax-ymin)/4));
 let g='';
 for(let v=ymin;v<=ymax;v+=step)g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v}</text>`;
 const lines=series.map(s=>{const p=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<polyline points="${p}" fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:${s.c}"/>`+s.vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" style="fill:${s.c}"/>`).join('')}).join('');
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Grafik riwayat">${g}${lines}<text x="${L}" y="${h-6}" font-size="10" style="fill:var(--muted)">${esc(labels[0])}</text>${n>1?`<text x="${w-R}" y="${h-6}" text-anchor="end" font-size="10" style="fill:var(--muted)">${esc(labels[n-1])}</text>`:''}</svg>`;
}

const CRISISBOX=`<div class="co d">${ic('alert',24)}<div><b>Kamu tidak harus menghadapi ini sendirian.</b><p class="sm" style="margin:4px 0 8px">Ceritakan sekarang kepada orang dewasa yang kamu percaya: orang tua, guru BK, atau tenaga kesehatan di Puskesmas. Kamu juga bisa menghubungi UPTD PPA Kabupaten Kuningan. Jika kamu merasa tidak aman, segera pergi ke IGD terdekat.</p><div class="row"><a class="btn btn-s sm" href="#chat-admin">Chat Admin</a></div></div></div>`;

 }

 mood:f=>{const h=LS.get('mood',[]),d=todayStr(),i=h.findIndex(x=>x.d===d),e={d,t:Date.now(),v:ST.mood,n:f.n.value.trim()};if(i>=0)h[i]=e;else h.push(e);LS.set('mood',h.slice(-60));f.reset();$('#mood-box').innerHTML=moodBox();toast('Tersimpan untuk hari ini.')},
 lapor:f=>{const g=n=>(f.elements[n].value.trim()||'-');const t=`Ringkasan laporan\nApa yang terjadi: ${g('a')}\nKapan: ${g('b')}\nDi mana: ${g('c')}\nPihak yang terlibat: ${g('d')}\nBukti yang ada: ${g('e')}\nBantuan yang dibutuhkan: ${g('f')}`;$('#lapor-out').innerHTML=`<pre style="white-space:pre-wrap;font:inherit;background:var(--surface2);border-radius:12px;padding:12px;margin:0 0 10px;user-select:all">${esc(t)}</pre>${copyBtn(t,'Salin ringkasan')}`},
 ed:async f=>{
  const col=f.dataset.col,isNew=!f.dataset.id,id=f.dataset.id||rid(),old=(ST.col[col]||[]).find(x=>x.id===id)||{},data=strip(old);
  CFG[col].f.forEach(([k,,t])=>{let v=f.elements[k]?f.elements[k].value:'';if(t==='number')v=Number(v)||0;data[k]=v});
  if(!data.tgl&&['berita','edukasi','galeri'].includes(col))data.tgl=todayStr();
  const b=f.querySelector('[type=submit]');b.disabled=true;
  try{if(isNew)await ensureLive(col);await ST.db.doc(col+'/'+id).set(data);closeM();toast('Tersimpan.')}catch(e){dbErr(e);b.disabled=false}},
 set:async f=>{const data={};SETF.forEach(([k])=>{data[k]=f.elements[k].value.trim()});try{await ST.db.doc('settings/site').set(data);toast('Pengaturan tersimpan.')}catch(e){dbErr(e)}}
};
const INP={
 'edu-q':t=>{ST.f.edu.q=t.value;$('#edu-res').innerHTML=eduRes()},
 'ber-q':t=>{ST.f.ber.q=t.value;$('#ber-res').innerHTML=newsRes()},
 'faq-q':t=>{ST.f.faq.q=t.value;$('#faq-res').innerHTML=faqRes()},
 'kk-t':t=>{const h=$('#kk-crisis');if(h)h.hidden=!CRISIS.test(t.value)},
 'kk-b':t=>{const v=$('#kbv');if(v)v.textContent=t.value}
};

/* ---------- router & shell ---------- */
const VIEWS={beranda:vBeranda,edukasi:vEdukasi,'cek-mental':vCek,'pojok-tenang':vTenang,'keluh-kesah':vKeluh,'chat-admin':vChat,motivasi:vMotivasi,game:vGame,kuis:vKuis,berita:vBerita,program:vProgram,galeri:vGaleri,tanya:vTanya,tentang:vTentang,admin:vAdmin};
const ROUTES=[['beranda','Beranda'],['edukasi','Edukasi'],['cek-mental','Cek Mental'],['keluh-kesah','Keluh Kesah'],['pojok-tenang','Pojok Tenang'],['motivasi','Motivasi'],['game','Game'],['kuis','Kuis'],['chat-admin','Chat Admin'],['berita','Berita'],['program','Program Kerja'],['galeri','Galeri'],['tanya','Tanya GenRe'],['tentang','Tentang']];
const DEP={berita:['beranda','berita','admin'],edukasi:['beranda','edukasi','admin'],program:['beranda','program','admin'],faq:['tanya','admin'],tim:['tentang','admin'],galeri:['galeri','admin'],curhat:['keluh-kesah','admin'],motivasi:['motivasi','admin'],settings:['*'],curhat_masuk:['admin'],balasan:['keluh-kesah','admin'],pertanyaan:['admin'],mh_stats:['admin'],admin_keputusan:['admin']};
function render(){const v=VIEWS[ST.route]||vBeranda;$('#view').innerHTML=v();updateNav()}
function updateNav(){$$('.nav a').forEach(a=>{if(a.dataset.r===ST.route){a.setAttribute('aria-current','page');try{a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}else a.removeAttribute('aria-current')})}
function go(){let h=location.hash.slice(1);if(!VIEWS[h])h='beranda';if(ST.route!==h){if(BR.on)stopBr();ST.route=h;window.scrollTo(0,0)}closeM();render()}
let softT=null;
function soft(){clearTimeout(softT);softT=setTimeout(()=>{const a=document.activeElement;if(a&&$('#view').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){ST.dirty=true;return}render()},150)}
function onData(n){if(n==='settings'||n==='curhat_masuk'||n==='pertanyaan'||n==='admin_keputusan')chrome();if(ST.canEdit&&(n==='curhat_masuk'||n==='pertanyaan')){const cc=(ST.cnt=ST.cnt||{}),c=inbox(n).length;if(cc[n]!==undefined&&c>cc[n])toast(n==='curhat_masuk'?'Curhat baru masuk. Buka Kotak Curhat di dasbor.':'Pertanyaan baru masuk di dasbor.');cc[n]=c}const d=DEP[n]||[];if(d.includes('*')||d.includes(ST.route))soft()}
function themeIcon(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const b=$('[data-act=theme]');if(b)b.innerHTML=ic(dark?'sun':'moon',18)}
function footerHtml(){const s=S();return `<div class="wrap"><div><div class="logos" style="margin-bottom:10px"><img class="logo" src="${LOGO.KNG}" alt=""><img class="logo" src="${LOGO.BKKBN}" alt=""><img class="logo" src="${LOGO.GENRE}" alt=""></div><h4>Sahabat</h4><p>Program kerja Duta GenRe Kabupaten Kuningan.</p><p><i>Rapih Winangun Kerta Raharja</i></p></div>
 <div><h4>Sekretariat</h4><p>${esc(s.sekretariat)}</p><p>Telp. ${esc(s.sekTelp)}</p></div>
 <div><h4>Menu</h4><p><a href="#tanya">Tanya</a> · <a href="#tentang">Tentang</a> · <a href="#admin">Pengelola</a></p><p>Informasi di situs ini bersifat edukasi dan bukan pengganti saran tenaga kesehatan.</p></div></div>`}
function chrome(){const s=S();$('#bn').innerHTML=s.banner?`<div class="bn"><div class="wrap">${esc(s.banner)}</div></div>`:'';const a=$('#admb');if(a){const pn=ST.canEdit?pending('curhat_masuk').length+pending('pertanyaan').length:0;a.innerHTML=ic('lock',16)+`<span class="lbl">${ST.canEdit?'Dasbor':'Pengelola'}</span>`+(pn?`<span class="bd d" aria-label="${pn} pesan baru">${pn}</span>`:'')}$('#ft').innerHTML=footerHtml()}
function shell(){
 $('#app').innerHTML=`<div id="bn"></div><header class="hdr"><div class="wrap top"><a class="brand" href="#beranda" aria-label="Sahabat, ke beranda"><span class="logos"><img class="logo" src="${LOGO.KNG}" alt=""><img class="logo" src="${LOGO.BKKBN}" alt=""><img class="logo" src="${LOGO.GENRE}" alt=""></span><span style="min-width:0"><b>Sahabat</b><small>Duta GenRe Kabupaten Kuningan</small></span></a><button class="ib" data-act="theme" aria-label="Ganti tema terang atau gelap"></button><a class="ib" href="#admin" id="admb"></a></div><nav class="nav" aria-label="Menu utama"><div class="in">${ROUTES.map(r=>`<a href="#${r[0]}" data-r="${r[0]}">${r[1]}</a>`).join('')}</div></nav></header><main id="view" tabindex="-1"></main><footer class="ft" id="ft"></footer><button class="btn btn-d fab" data-act="help">${ic('phone',18)} Butuh bantuan?</button><div id="mdl"></div><div id="toast" role="status" hidden></div><div id="cover" hidden data-act="uncover" role="button" tabindex="0"><div><div style="font-size:1.7rem;font-family:serif">Catatan</div><p>Ketuk di mana saja untuk kembali.</p></div></div>`;
 chrome();themeIcon();
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(a==='ovclose'){if(e.target===el)closeM();return}const fn=ACT[a];if(fn)fn(el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=FORM[f.dataset.form];if(fn)fn(f)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&INP[k])INP[k](e.target)});
document.addEventListener('focusout',()=>{if(ST.dirty){ST.dirty=false;setTimeout(soft,80)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#cover').hidden)$('#cover').hidden=true;else closeM()}});
document.addEventListener('change',async e=>{
 const t=e.target;if(!(t.matches&&t.matches('input[data-file]')))return;
 const file=t.files&&t.files[0];if(!file||!ST.assets)return;toast('Mengunggah gambar...');
 try{const blob=await shrink(file),r=await ST.assets.upload(blob,{type:'image/jpeg'}),box=t.closest('[data-imgbox]');box.querySelector('input[type=hidden]').value=r.id;let pv=box.querySelector('img');if(!pv){pv=document.createElement('img');pv.className='pv';pv.alt='';box.prepend(pv)}pv.src=r.url;toast('Gambar terunggah. Tekan Simpan untuk menyimpan.')}
 catch(err){toast('Gambar belum terunggah ('+((err&&err.code)||'coba lagi')+').')}
});
window.addEventListener('hashchange',go);

/* ---------- sinkronisasi online ---------- */
const PUBC=['berita','edukasi','program','faq','tim','galeri','curhat','settings','motivasi'];
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const canon=v=>Array.isArray(v)?v.map(canon):(v&&typeof v==='object')?Object.keys(v).sort().reduce((o,k)=>(o[k]=canon(v[k]),o),{}):v;
const seedJson=o=>JSON.stringify(canon(o)).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
function seedNow(){const o={};PUBC.forEach(n=>{const l=ST.col[n];if(l&&l.length)o[n]=l.slice().sort((a,b)=>String(a.id).localeCompare(String(b.id)))});return o}
let SEED={},SEEDJ='';
function buildDoc(){
 const head=[...document.querySelectorAll('title,meta[name="claude:viewport-fit-sides"],link[rel="preconnect"],link[rel="stylesheet"][href*="fonts.googleapis.com"],style[data-sg]')].map(n=>n.outerHTML).join('\n');
 const main=document.getElementById('sg-main').textContent;
 const ST_='<'+'script',EN_='<'+'/script>';
 return SKEL+'\n'+head+'\n<div id="app"></div>\n'+ST_+' type="application/json" id="sg-seed" data-sg>'+seedJson(seedNow())+EN_+'\n'+ST_+' id="sg-main" data-sg>'+main+EN_+'\n</body></html>';
}
let pubT=null,pubBusy=false;
function pubLabel(){const k=ST.pubSt||'';return k==='menunggu'?'Menyiapkan publikasi...':k==='jalan'?'Memublikasikan...':k==='gagal'?`<span class="bd d">Belum terpublikasi</span> ${esc(ST.pubErr||'')}`:'<span class="bd o">Otomatis</span> Perubahan langsung tampil untuk semua pengunjung.'}
function pubUi(){const e=$('#pubst');if(e)e.innerHTML=pubLabel()}
function schedPub(){if(!ST.art||!ST.canEdit)return;clearTimeout(pubT);ST.pubSt='menunggu';pubUi();pubT=setTimeout(doPub,2500)}
async function doPub(){
 if(!ST.art||!ST.canEdit)return;
 if(pubBusy){schedPub();return}
 pubBusy=true;ST.pubSt='jalan';pubUi();
 try{await ST.art.publish(buildDoc());ST.pubSt='ok'}
 catch(e){ST.pubSt='gagal';const c=e&&e.code;ST.pubErr=c==='conflict'?'Ada versi yang lebih baru. Muat ulang halaman lalu simpan lagi.':c==='consent_required'?'Setujui izin memublikasikan pada jendela yang muncul, lalu tekan Publikasikan sekarang.':(c==='not_writer'||c==='not_granted')?'Akunmu belum punya izin memublikasikan. Pengelola perlu akses Editor.':'Tekan Publikasikan sekarang untuk mencoba lagi.'}
 pubBusy=false;pubUi();
}
function wrapDb(db){return{collection:n=>db.collection(n),doc:p=>{const r=db.doc(p);if(!PUBC.includes(p.split('/')[0]))return r;const w=f=>async(...a)=>{const x=await f(...a);schedPub();return x};return{get:()=>r.get(),set:w((...a)=>r.set(...a)),update:w((...a)=>r.update(...a)),delete:w((...a)=>r.delete(...a))}}}}
function autoSync(){
 if(!ST.canEdit||!ST.art)return;
 if(seedJson(seedNow())===SEEDJ)return;
 const cnt=o=>Object.values(o).reduce((a,l)=>a+l.length,0);if(cnt(seedNow())===0&&cnt(SEED)>0)return;
 let last=0;try{last=+sessionStorage.getItem('sg_ap')||0}catch(e){}
 if(Date.now()-last<90000)return;
 try{sessionStorage.setItem('sg_ap',String(Date.now()))}catch(e){}
 schedPub();
}

async function boot(){
 const th=LS.get('theme',null);if(th)document.documentElement.dataset.theme=th;
 try{SEED=JSON.parse(document.getElementById('sg-seed').textContent||'{}')}catch(e){SEED={}}
 SEEDJ=seedJson(SEED);Object.keys(SEED).forEach(k=>{ST.col[k]=SEED[k]});
 shell();go();
 try{
  const cl=window.claude;
  if(cl&&cl.use){
   const get=n=>cl.use(n).catch(()=>null);
   const [user,db,assets,dl,art]=await Promise.all([get('user'),get('db'),get('assets'),get('downloads'),get('artifact')]);
   ST.user=user;ST.db=db?wrapDb(db):null;ST.assets=assets;ST.dl=dl;ST.art=art;
   if(user){ST.canEdit=!!((await user.canEdit())||(await user.isOwner()));ST.canWrite=await user.can('data.write');ST.me=await user.me();ST.uid=await user.id()}
   if(db){
    const sub=n=>{try{db.collection(n).onSnapshot(s=>{ST.col[n]=s.docs.map(d=>({id:d.id,...d.data()}));(ST.got=ST.got||{})[n]=1;if(!ST.synced&&PUBC.every(k=>ST.got[k])){ST.synced=1;autoSync()}onData(n)},()=>{})}catch(e){}};
    PUBC.forEach(sub);
    if(ST.canEdit)['curhat_masuk','pertanyaan','mh_stats','admin_keputusan','balasan'].forEach(sub);
    else if(ST.uid){try{db.doc('balasan/'+ST.uid).onSnapshot(s=>{const n=s&&s.exists?((s.data().items)||[]).length:0;ST.col.balasan=s&&s.exists?[{id:ST.uid,...s.data()}]:[];if(ST.repN!==undefined&&n>ST.repN)toast('Ada balasan baru dari pengelola di Buku keluh kesahmu.');ST.repN=n;onData('balasan')},()=>{})}catch(e){}}
   }
  }
 }catch(e){}
 ST.ready=true;chrome();render();
}
boot();
})();

</script>
